name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., 1.0.0)'
        required: true
        type: string
      prerelease:
        description: 'Is this a pre-release?'
        required: false
        type: boolean
        default: false

jobs:
  release:
    uses: builtnorth/.github/.github/workflows/composer-package-release.yml@main
    with:
      package-name: 'wp-cli-builtnorth'
      package-display-name: 'WP CLI Built North'
      composer-namespace: 'builtnorth/wp-cli-builtnorth'
      version: ${{ inputs.version }}
      prerelease: ${{ inputs.prerelease }}
      # Match tests.yml — package has no phpunit/phpcs/phpcompat yet.
      composer-repository-profile: coding-standards-only
      run-coverage: false
      run-phpcs: false
      run-phpcompat: false
    permissions:
      contents: write
    secrets: inherit
