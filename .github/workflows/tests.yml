name: Tests

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  ci:
    uses: builtnorth/.github/.github/workflows/composer-package-ci.yml@main
    secrets: inherit
    with:
      composer-repository-profile: coding-standards-only
      # Package has no phpunit.xml and its code predates the phpcs standard.
      run-coverage: false
      run-phpcs: false
